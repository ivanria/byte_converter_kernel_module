
name: Kernel Module Build

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        kernel-version: [ '6.1', '6.6' ]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential kmod gcc make

      - name: Setup Kernel Headers
        run: |
          sudo apt-get install -y linux-headers-$(uname -r)

      - name: Build Module
        run: |
          make

      #- name: Run checkpatch
        #run: |
          #./checkpatch.pl --no-tree --file --terse  *.c *.h
